[project]
name = "hive"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "pyyaml",
  "pytest",
  "requests",
]

[project.scripts]
hive-dispatcher = "hive.dispatcher.main:main"
hive-worker = "hive.worker.main:main"

[tool.pytest.ini_options]
testpaths = ["tests/unit"]

[tool.ruff]
line-length = 100
target-version = "py312"


[tool.setuptools.packages.find]
include = ["hive*", "dispatcher*", "worker*"]


